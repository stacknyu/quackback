# ============================================================================
# Quackback — production stack (self-hosting), MinIO removed
# ============================================================================
# Bundled Postgres kept as-is. Object storage points to an external S3
# provider (Cloudflare R2 in this case) instead of the bundled MinIO.
#
# Quick start:
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================================

services:
  app:
    image: ghcr.io/quackbackio/quackback:${QUACKBACK_TAG:-latest}
    container_name: quackback-app
    restart: unless-stopped
    init: true
    # Carries BASE_URL, SECRET_KEY, email settings, S3_* vars, etc.
    env_file: .env
    # Only DATABASE_URL is derived/fixed here (bundled Postgres).
    # S3_* now comes straight from .env (pointed at R2) — not overridden here.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-quackback}
      REDIS_URL: redis://dragonfly:6379
    expose:
      - '3000'
    networks:
      - internal
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quackback}
    # No host port — Postgres is reachable only on the internal network.
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=${POSTGRES_DB:-quackback} -c max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis-compatible store for the BullMQ background job queue.
  # --cluster_mode=emulated --lock_on_hashtags is required for BullMQ.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:${DRAGONFLY_IMAGE_TAG:-latest}
    container_name: quackback-dragonfly
    restart: unless-stopped
    command: ['--cluster_mode=emulated', '--lock_on_hashtags']
    networks:
      - internal
    # No host port — reachable only on the internal network.
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  # Private network for app <-> postgres traffic. Postgres is attached
  # here only, so it's never reachable from Traefik or the outside.
  internal:
  # Dokploy's shared Traefik network — required so Traefik can route
  # requests to the app container. If this project has "Isolated
  # Deployments" enabled in Dokploy, remove this whole network block
  # and the "dokploy-network" entries above; Dokploy wires an
  # equivalent network automatically in that mode.
  dokploy-network:
    external: true

volumes:
  postgres_data:
  dragonfly_data:
